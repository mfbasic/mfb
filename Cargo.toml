# bug-347: `repository/` was a separate workspace, so `cargo test`/`--workspace`
# and `cargo llvm-cov --workspace` never built its test targets — 164 tests and
# ~13k lines of network-facing Rust sat outside every gate. Naming it a member
# puts it back in the test and coverage denominators.
[workspace]
members = [".", "repository"]
# With a package at the workspace root, a bare `cargo test` would select only
# that root package. Naming both keeps `cargo test` (no flags) equivalent to
# `cargo test --workspace`, which is what bug-347 requires.
default-members = [".", "repository"]

[package]
name = "mfb"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
mfb_repository = { path = "repository" }
sha2 = "0.10"
tinyjson = "2.5"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
# Compiler build-time only (macOS app-icon `.icns` generation, plan-22-B). These
# add nothing to emitted programs. `image` is pinned to the PNG codec to bound the
# transitive tree.
image = { version = "0.25", default-features = false, features = ["png"] }
icns = "0.3"

# bug-345-C2: production items stranded below an inline `mod tests` (the tests
# read as the end of the file, so the code under them is easy to miss). Five
# such sites were cleaned up; deny keeps them from coming back.
[lints.clippy]
items_after_test_module = "deny"

[lints.rust]
# `--cfg perf` opts a build into runtime perf-tracking injection
# (`perf_injection_enabled()`), independent of debug/release. Register it so the
# 1.80+ unexpected-cfg lint recognizes the name instead of warning on it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(perf)'] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# plan-109-E/F: the RFC 9180 HPKE interop harness (`tests/interop/rt_crypto_hpke_interop.rs`)
# needs an implementation independent of the MFB package — X25519 from
# curve25519-dalek and HKDF/AES-256-GCM/ChaCha20Poly1305 from ring. Both are
# already in the lockfile through the repository crate's rustls/ed25519 deps,
# so they resolve offline and add no new compiled code.
ring = "0.17"
curve25519-dalek = "4"
# `tests/interop/rt_crypto_mac_kdf_interop.rs` checks every `crypto::Hash` selector of
# `hmac`, and `ring` has no SHA-224 — this covers that one selector (over `sha2`,
# already a normal dependency). Already in the lockfile through the repository
# crate's argon2/pbkdf2 deps, so it resolves offline and adds no new compiled code.
hmac = "0.12"
# `tests/interop/rt_crypto_key_interop.rs` checks MFB's Ed25519 signatures against TWO
# independent verifiers, not one — agreement with a single implementation is
# weaker evidence, and Ed25519 being deterministic means the signature can be
# compared byte for byte rather than only round-tripped. Already in the lockfile
# through the repository crate, so it resolves offline and adds no new compiled code.
ed25519-dalek = "2"
# The repository acceptance test needs to age a `package_blobs` row to exercise
# `mfb-repo gc`'s 24h grace period (plan-49 §3.1) without waiting a day. Same
# version/features as the repository crate's, so it reuses the compiled SQLite.
rusqlite = { version = "0.31", features = ["bundled"] }
# bug-510: the decoder-bound tests (`tests/rt_json_bounds.rs`,
# `tests/rt_regex_bounds.rs`) assert a child's PEAK RSS, which only `wait4`'s
# `ru_maxrss` reports for one specific child (`RUSAGE_CHILDREN` would fold in the
# `mfb build` child). Already in the lockfile through ring/rustls, so it resolves
# offline and adds no new compiled code.
libc = "0.2"

# The interop proofs live in `tests/interop/` rather than loose in `tests/`.
# Cargo only auto-discovers `tests/*.rs` and `tests/<dir>/main.rs`, so a plain
# subdirectory of test files is invisible to it — these stanzas are what keep
# them running. Declaring them explicitly (rather than adding a
# `tests/interop/main.rs` that pulls each in as a module) keeps ONE BINARY PER
# TEST and keeps the target names unchanged, so `cargo test --test
# rt_crypto_hpke_interop` still works exactly as the plan-109 docs record it.
#
# `autotests` stays at its edition-2021 default of true: explicit `[[test]]`
# sections are additive there, and the other ~139 files in `tests/` are still
# discovered automatically. (Under edition 2015 the first `[[test]]` would have
# silently switched the rest off.)
#
# You do not have to remember any of this: `tests/test_targets_registered.rs`
# fails if a file under `tests/interop/` has no stanza, and prints the TOML to
# paste. A test that never runs cannot hide here.
[[test]]
name = "rt_crypto_hpke_interop"
path = "tests/interop/rt_crypto_hpke_interop.rs"

[[test]]
name = "rt_crypto_mac_kdf_interop"
path = "tests/interop/rt_crypto_mac_kdf_interop.rs"

[[test]]
name = "rt_crypto_aead_interop"
path = "tests/interop/rt_crypto_aead_interop.rs"

[[test]]
name = "rt_crypto_key_interop"
path = "tests/interop/rt_crypto_key_interop.rs"

# The CLI tests live in `tests/cli/` rather than loose in `tests/`. Cargo only
# auto-discovers `tests/*.rs` and `tests/<dir>/main.rs`, so a plain subdirectory
# of test files is invisible to it — these stanzas are what keep them running.
# Declaring them explicitly (rather than adding a `tests/cli/main.rs` that pulls
# each in as a module) keeps ONE BINARY PER TEST and keeps every target name
# unchanged, so `cargo test --test cli_repo_publish` still works.
#
# `autotests` stays at its edition-2021 default of true: explicit `[[test]]`
# sections are additive there, and the rest of `tests/` is still discovered
# automatically. (Under edition 2015 the first `[[test]]` would have silently
# switched the rest off.)
#
# You do not have to remember any of this: `tests/test_targets_registered.rs`
# fails if a file under `tests/cli/` has no stanza, and prints the TOML to
