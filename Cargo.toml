# bug-347: `repository/` was a separate workspace, so `cargo test`/`--workspace`
# and `cargo llvm-cov --workspace` never built its test targets — 164 tests and
# ~13k lines of network-facing Rust sat outside every gate. Naming it a member
# puts it back in the test and coverage denominators.
[workspace]
members = [".", "repository", "wire"]
# With a package at the workspace root, a bare `cargo test` would select only
# that root package. Naming every member keeps `cargo test` (no flags)
# equivalent to `cargo test --workspace`, which is what bug-347 requires — and
# is why `wire` (plan-126-B) is listed here as well as above: a member absent
# from `default-members` has its tests outside a bare `cargo test`, exactly the
# hole bug-347 closed for `repository`.
default-members = [".", "repository", "wire"]

# A bare `cargo test` builds with release optimizations: the suite's in-process
# compiler tests run hours in an unoptimized build. `cargo build`/`cargo run`
# keep the normal debug profile.
#
# Optimized, but still CHECKED. `release` turns off debug assertions and overflow
# checks, and inheriting that silently compiled out every `debug_assert!`
# invariant in the compiler (the riscv64 v128 slot-overlap check, the RULES drift
# guard) and the `#[cfg(debug_assertions)]` tests that prove them, e.g.
# `rules::tests::unknown_rule_name_trips_the_debug_assert`.
[profile.test]
inherits = "release"
debug-assertions = true
overflow-checks = true

[package]
name = "mfb"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
mfb_repository = { path = "repository" }
# plan-126-B: the one home for the byte primitives and `.mfp`/MFPC framing this
# crate and `mfb_repository` both need. It depends on neither of them.
mfb_wire = { path = "wire" }
sha2 = "0.10"
tinyjson = "2.5"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
# Compiler build-time only (macOS app-icon `.icns` generation, plan-22-B). These
# add nothing to emitted programs. `image` is pinned to the PNG codec to bound the
# transitive tree.
image = { version = "0.25", default-features = false, features = ["png"] }
icns = "0.3"

# bug-345-C2: production items stranded below an inline `mod tests` (the tests
# read as the end of the file, so the code under them is easy to miss). Five
# such sites were cleaned up; deny keeps them from coming back.
[lints.clippy]
items_after_test_module = "deny"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# plan-109-E/F: the RFC 9180 HPKE interop harness (`tests/interop/rt_crypto_hpke_interop.rs`)
# needs an implementation independent of the MFB package — X25519 from
# curve25519-dalek and HKDF/AES-256-GCM/ChaCha20Poly1305 from ring. Both are
# already in the lockfile through the repository crate's rustls/ed25519 deps,
# so they resolve offline and add no new compiled code.
ring = "0.17"
curve25519-dalek = "4"
# `tests/interop/rt_crypto_mac_kdf_interop.rs` checks every `crypto::Hash` selector of
# `hmac`, and `ring` has no SHA-224 — this covers that one selector (over `sha2`,
# already a normal dependency). Already in the lockfile through the repository
# crate's argon2/pbkdf2 deps, so it resolves offline and adds no new compiled code.
hmac = "0.12"
# `tests/interop/rt_crypto_key_interop.rs` checks MFB's Ed25519 signatures against TWO
# independent verifiers, not one — agreement with a single implementation is
# weaker evidence, and Ed25519 being deterministic means the signature can be
# compared byte for byte rather than only round-tripped. Already in the lockfile
# through the repository crate, so it resolves offline and adds no new compiled code.
ed25519-dalek = "2"
# The repository acceptance test needs to age a `package_blobs` row to exercise
# `mfb-repo gc`'s 24h grace period (plan-49 §3.1) without waiting a day. Same
# version/features as the repository crate's, so it reuses the compiled SQLite.
rusqlite = { version = "0.31", features = ["bundled"] }
# bug-510: the decoder-bound tests (`tests/runtime/rt_json_bounds.rs`,
# `tests/runtime/rt_regex_bounds.rs`) assert a child's PEAK RSS, which only `wait4`'s
# `ru_maxrss` reports for one specific child (`RUSAGE_CHILDREN` would fold in the
# `mfb build` child). Already in the lockfile through ring/rustls, so it resolves
# offline and adds no new compiled code.
libc = "0.2"
# plan-137: `tests/interop/rt_compress_interop.rs` checks `compress::` against an
# implementation that shares no code with the MFBASIC one — `flate2::Crc` (crc32fast
# underneath, since the `zlib-rs` feature is off) for CRC-32. Already in the lockfile
# as a normal dependency through `image` → `png`, so it resolves offline and adds no
# new compiled code.
flate2 = "1"
# bug-615/bug-618: the Fixed and Float trig accuracy tests
# (`tests/runtime/rt_math_fixed_trig_accuracy.rs`, `rt_math_float_trig_large_angles.rs`)
# check against an exact big-integer evaluation (Machin pi, Taylor sin/cos); near a
# pole or past 2^53 no f64 oracle has the bits. Already in the lockfile through the
# repository crate's jsonwebtoken, so it resolves offline and adds no new compiled code.
num-bigint = "0.4"

# ---------------------------------------------------------------------------
# Test targets.
#
# Every test lives in a category directory under `tests/` — none sits loose at
# the top. Cargo only auto-discovers `tests/*.rs` and `tests/<dir>/main.rs`, so
# a plain subdirectory of test files is INVISIBLE to it: these stanzas are what
# keep them running.
#
# Declaring them explicitly (rather than a `tests/<dir>/main.rs` pulling each in
# as a module) keeps ONE BINARY PER TEST and keeps every target name unchanged,
# so `cargo test --test cli_repo_publish` works exactly as ~40 plan and bug
# documents record it.
#
# `autotests` stays at its edition-2021 default of true: explicit `[[test]]`
# sections are additive there. (Under edition 2015 the first one would have
# silently switched auto-discovery off for everything else.)
#
# You do not have to remember any of this.
# `tests/guards/test_targets_registered.rs` fails if a file has no stanza, if a
# stanza names a missing file, if a stanza is misnamed, or if a test file
# reappears directly in `tests/` — and it prints the TOML to paste.
# ---------------------------------------------------------------------------

