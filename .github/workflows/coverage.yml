name: coverage
on: [push, pull_request]

jobs:
  # Compile once. Publishes the mfb binary so the acceptance and artifact jobs
  # can run without recompiling. A build failure here blocks every downstream
  # job (via `needs: build`), so broken code never fans out to four runners.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gen_regex_unicode.py derives the general-category table from the Python
      # runtime's bundled `unicodedata`, whose Unicode version is tied to the
      # Python minor version (3.14.x → Unicode 16.0.0). The checked-in artifact
      # is pinned to 16.0.0, so check-generated only reproduces it under a Python
      # that ships the same Unicode. ubuntu-latest's system python3 lags (Unicode
      # 15.0.0), which drifts the regex table — pin the interpreter to match.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Generated-artifact integrity
        run: sh scripts/check-generated.sh
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Compile mfb
        run: cargo build --bin mfb
      # v4 artifacts are zipped and DROP the executable bit; the consumers chmod
      # +x after download.
      - uses: actions/upload-artifact@v4
        with:
          name: mfb-bin
          path: target/debug/mfb

  # --- parallel test jobs (all gated on `build`) ---

  # Uninstrumented unit/integration suite. Recompiles under the test profile
  # (separate from the build job's binary), so this job builds its own targets.
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Cargo test
        run: cargo test --workspace

  # Acceptance: reuses the compiled binary (no recompile). test-accept.sh uses
  # bash arrays + process substitution, so it must run under bash (not sh).
  acceptance:
    needs: build
    runs-on: ubuntu-latest
    # Backstop against a wedged fixture: test-accept.sh already caps each fixture's
    # build and execution at 300s (run_with_watchdog), so a healthy run finishes
    # well under this. Without it, a hang would burn GitHub's 6-hour job default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mfb-bin
          path: target/debug
      - run: chmod +x target/debug/mfb
      - name: Acceptance tests
        run: bash scripts/test-accept.sh target/debug/mfb target/accept-actual

  # Golden/artifact byte-identity gate: execution-free codegen-dump diff. Reuses
  # the compiled binary; `all` sweeps every fixture under tests/. Also bash-only.
  artifact:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mfb-bin
          path: target/debug
      - run: chmod +x target/debug/mfb
      - name: Golden/artifact tests
        run: bash scripts/artifact-gate.sh target/debug/mfb all

  # Coverage recompiles instrumented (a third profile), so it builds its own
  # targets rather than reusing the binary.
  coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Run coverage
        run: sh scripts/coverage.sh
      - name: Per-file 95% gate
        run: sh scripts/coverage-check.sh
      - name: Global floor gate
        run: |
          . ./scripts/coverage-common.sh
          cargo llvm-cov report $PKG_FLAGS \
            --ignore-filename-regex "$IGNORE" \
            --fail-under-lines 95
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage

  # Runs only after every test job above has passed. build-examples.sh builds
  # each example for all registered targets and bundles them into
  # target/examples.zip. It builds its own release compiler (the test jobs'
  # binary is debug), so this job needs the Rust toolchain. bash-only.
  examples:
    needs: [test, acceptance, artifact, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build examples for all targets
        run: bash scripts/build-examples.sh
      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: target/examples.zip
          retention-days: 14
