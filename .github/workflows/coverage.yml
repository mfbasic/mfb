name: coverage
on: [push, pull_request]

jobs:
  # Formatting gate: `cargo fmt --all -- --check` is execution-free and reformats
  # nothing — it exits non-zero if any file differs from rustfmt output. `--all`
  # covers every workspace member, so this single step checks BOTH the root `mfb`
  # crate (src/) and `repository/`. No build or compiled binary needed, so it runs
  # in parallel with `build` for fast feedback. The toolchain is pinned to 1.96.0
  # to match the rustfmt version main was last formatted with, keeping the check
  # deterministic across runners.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Compile once, RELEASE. Publishes the mfb binary so the acceptance and
  # artifact jobs can run without recompiling. A build failure here blocks every
  # downstream job (via `needs: build`), so broken code never fans out to four
  # runners.
  #
  # Release, not debug, so every job exercises the binary users actually get.
  # It also removes a duplicated compile: `tests/common::mfb_exe()` resolves the
  # compiler under `target/release/` and runs `cargo build --release` itself
  # (never trusting mere existence — a stale binary would silently test old
  # codegen), so the test matrix was already building a release compiler on top
  # of its debug one.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gen_regex_unicode.py derives the general-category table from the Python
      # runtime's bundled `unicodedata`, whose Unicode version is tied to the
      # Python minor version (3.14.x → Unicode 16.0.0). The checked-in artifact
      # is pinned to 16.0.0, so check-generated only reproduces it under a Python
      # that ships the same Unicode. ubuntu-latest's system python3 lags (Unicode
      # 15.0.0), which drifts the regex table — pin the interpreter to match.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Generated-artifact integrity
        run: sh scripts/check-generated.sh
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Compile mfb
        run: cargo build --release --bin mfb
      # v4 artifacts are zipped and DROP the executable bit; the consumers chmod
      # +x after download.
      - uses: actions/upload-artifact@v4
        with:
          name: mfb-bin
          path: target/release/mfb

  # --- parallel test jobs (all gated on `build`) ---

  # Uninstrumented unit/integration suite across every supported host family.
  # The native GitHub runners cover x86-64/glibc, AArch64/glibc, Win64, and
  # macOS/AArch64; riscv64/glibc runs on a RISE-provided bare-metal runner (see
  # that row). The x86-64/musl row uses Rust's musl target on the native
  # Linux runner. Each matrix row recompiles its test binaries (separate from
  # build's binary) — in release, matching the rest of the pipeline.
  #
  # NOTE: `--release` clears `debug_assertions`, so the ~40 `debug_assert!` /
  # `#[cfg(debug_assertions)]` guards in `src/` (frame/stack-access checks in
  # `validation.rs` and `linear_scan.rs`, IR and registry invariants) no longer
  # execute anywhere in CI. They were already inert for every test that drives
  # the compiler through `mfb_exe()`, which has always been release; this
  # extends that to the in-process unit tests too.
  test:
    needs: build
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # A failure on one platform must not hide results from the other five.
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: linux-x86_64-glibc
            runner: ubuntu-24.04
            rust_target: native
          - name: linux-x86_64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - name: linux-aarch64-glibc
            runner: ubuntu-24.04-arm
            rust_target: native
          - name: windows-x86_64
            runner: windows-2025
            rust_target: native
          - name: macos-aarch64
            runner: macos-15
            rust_target: native
          # Native RISC-V, on RISE's free bare-metal runners (Scaleway EM-RV1) —
          # real silicon, so no QEMU/binfmt and no riscv64 sysroot. Everywhere
          # else in this pipeline riscv64 is only a CROSS target: the artifact
          # gate's 28 `*.linux-riscv64.ncodesum` goldens are emitted on x86-64 and
          # the bytes are never executed. This row is the only place riscv64 is
          # the HOST — which also makes `tests/golden.rs::artifact_gate_all` sweep
          # every fixture with `linux-riscv64` as the host target for the first
          # time, since `artifact-gate.sh` derives that from `uname -m`.
          #
          # Needs the `rise-risc-v-runners` GitHub App on the org. Without it the
          # row queues forever rather than failing fast, which is the first thing
          # to check if it sits in "Waiting for a runner":
          # https://riscv-runners.riseproject.dev/
          #
          # Expect `mfb build -app` to be refused here:
          # `linux_riscv64::supports_app_mode` returns a deliberate `false` (the
          # GTK4 toolkit was never ported to rv64 — bug-117.1), so the nine test
          # binaries that call `common::build_app` cannot pass —
          # cli_app_canvas_mode, cli_macos_app_io_input_imports and the seven
          # rt_canvas_* suites. Left unfiltered on purpose: `fail-fast: false`
          # above means a red row here hides nothing from the other five, and a
          # `--skip` list would hide the unknown failures along with the known
          # one. Read past them rather than assuming everything red is bug-117.1.
          - name: linux-riscv64-glibc
            runner: ubuntu-24.04-riscv
            rust_target: native
    steps:
      - uses: actions/checkout@v4
      - name: Install native Rust toolchain
        if: matrix.rust_target == 'native'
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Install cross Rust toolchain
        if: matrix.rust_target != 'native'
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install musl linker
        if: matrix.rust_target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      # A Linux `--app` build LINKS GTK 4 — libgtk-4.so.1 is a DT_NEEDED of the
      # emitted ELF, alongside gio/glib/gobject/cairo/pango — so the loader needs
      # it present before `main` runs, headless or not. Without it the six
      # rt_canvas_* suites exit 127 with "error while loading shared libraries".
      # `libgtk-4-1` pulls the whole set transitively; the -dev package is not
      # needed, since mfb emits its own binaries and links nothing at build time.
      # Every Linux row needs it, including the musl one: that row cross-compiles
      # the compiler but still runs the app it builds on this glibc runner.
      - name: Install the GTK 4 runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-1
      - name: Cargo test (native)
        if: matrix.rust_target == 'native'
        run: cargo test --release --workspace
      - name: Cargo test (x86-64 musl)
        if: matrix.rust_target == 'x86_64-unknown-linux-musl'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo test --release --workspace --target x86_64-unknown-linux-musl
  # Acceptance: reuses the compiled binary (no recompile). test-accept.sh uses
  # bash arrays + process substitution, so it must run under bash (not sh).
  acceptance:
    needs: build
    runs-on: ubuntu-latest
    # Backstop against a wedged fixture: test-accept.sh already caps each fixture's
    # build and execution (run_with_watchdog, MFB_ACCEPT_RUN_TIMEOUT below), so a
    # healthy run finishes well under this. Without it, a hang would burn GitHub's
    # 6-hour job default.
    #
    # History: 40 minutes was once enough only because the runnable fixtures were
    # failing instantly (the musl binary ran on a glibc runner and died in the
    # dynamic loader at exit 127 without executing). Under the debug compiler a
    # real sweep blew past it — cancelled at fixture 651 of 1271, ~51% in 40 min.
    # This job now drives the RELEASE compiler, which measured ~5x faster on
    # `tests/acceptance` (63.7s vs 338.6s on an M-series Mac), so the sweep is
    # expected back in the ~20-30 minute range. The cap stays generous on purpose:
    # it is a hang backstop, not a performance assertion, and a tight bound here
    # only buys flaky cancellations on a slow shared runner.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mfb-bin
          path: target/release
      - run: chmod +x target/release/mfb
      # `net::ping` opens an ICMP *datagram* socket — SOCK_DGRAM/IPPROTO_ICMP,
      # the unprivileged form — which Linux gates on `net.ipv4.ping_group_range`.
      # The runner image leaves that at the empty default `1 0`, so the socket is
      # refused with EACCES and `net::ping` raises. That is the documented
      # contract for a host that will not let you ask (plan-110-A §C3), but it is
      # not what `rt-behavior/net/func_net_ping_valid` and
      # `rt-error/net/func_net_ping_range_invalid` pin, and it is the whole of the
      # acceptance job's "2 mismatch(es)".
      #
      # Open the range instead of weakening the fixtures: this is the permission
      # an ordinary desktop Linux ships with (box 2228 reads `0 2147483647`), and
      # with it the fixture reproduces its golden line for line on Linux. The
      # denied path is not lost — `scripts/check-icmp-permission.sh` manufactures
      # the denial in a throwaway netns and asserts the raise.
      - name: Permit unprivileged ICMP sockets
        run: |
          cat /proc/sys/net/ipv4/ping_group_range
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Acceptance tests
        # The harness's per-fixture watchdog defaults to 300s, which the debug
        # compiler overran on the biggest fixtures (exit 99, "timeout") — hence the
        # old 1200s override. Release is ~5x faster, so 300s would very likely do;
        # 600s is kept as headroom because CI runners are slower than the machine
        # those timings came from, and the only thing this bound has to do is turn
        # a genuine hang into one named failure inside the job cap above.
        env:
          MFB_ACCEPT_RUN_TIMEOUT: "600"
        run: bash scripts/test-accept.sh target/release/mfb target/accept-actual

  # Golden/artifact byte-identity gate: execution-free codegen-dump diff. Reuses
  # the compiled binary; `all` sweeps every fixture under tests/. Also bash-only.
  artifact:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mfb-bin
          path: target/release
      - run: chmod +x target/release/mfb
      - name: Golden/artifact tests
        run: bash scripts/artifact-gate.sh target/release/mfb all

  # Coverage recompiles instrumented, so it builds its own targets rather than
  # reusing the binary.
  #
  # This job deliberately stays on cargo-llvm-cov's default (dev) profile while
  # the rest of the pipeline is release. Coverage is a line-mapping measurement:
  # optimization inlines and merges lines, so an optimized instrumented build
  # reports different — and less meaningful — per-file numbers for the same
  # source. Switching it would move the 98% per-file gate and the global floor
  # for reasons that have nothing to do with what the tests actually cover.
  coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      # Same reason as the test matrix: this job runs the whole suite, so the
      # canvas app binaries it builds need the GTK 4 they link against.
      - name: Install the GTK 4 runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-1
      - name: Run coverage
        run: sh scripts/coverage.sh
      - name: Per-file 98% gate
        run: sh scripts/coverage-check.sh
      - name: Global floor gate
        run: |
          . ./scripts/coverage-common.sh
          cargo llvm-cov report $PKG_FLAGS \
            --ignore-filename-regex "$IGNORE" \
            --fail-under-lines 98
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage

  # Runs only after every test job above has passed. build-examples.sh builds
  # each example for all registered targets and bundles them into
  # target/examples.zip. It compiles the compiler from source rather than taking
  # the `build` job's artifact, so this job needs the Rust toolchain. bash-only.
  examples:
    needs: [test, acceptance, artifact, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build examples for all targets
        run: bash scripts/build-examples.sh
      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: target/examples.zip
          retention-days: 14
