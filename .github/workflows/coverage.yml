name: coverage
on: [push, pull_request]

jobs:
  # Formatting gate: `cargo fmt --all -- --check` is execution-free and reformats
  # nothing — it exits non-zero if any file differs from rustfmt output. `--all`
  # covers every workspace member, so this single step checks BOTH the root `mfb`
  # crate (src/) and `repository/`. No build or compiled binary needed, so it runs
  # in parallel with `build` for fast feedback. The toolchain is pinned to 1.96.0
  # to match the rustfmt version main was last formatted with, keeping the check
  # deterministic across runners.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Compile once. Publishes the mfb binary so the acceptance and artifact jobs
  # can run without recompiling. A build failure here blocks every downstream
  # job (via `needs: build`), so broken code never fans out to four runners.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gen_regex_unicode.py derives the general-category table from the Python
      # runtime's bundled `unicodedata`, whose Unicode version is tied to the
      # Python minor version (3.14.x → Unicode 16.0.0). The checked-in artifact
      # is pinned to 16.0.0, so check-generated only reproduces it under a Python
      # that ships the same Unicode. ubuntu-latest's system python3 lags (Unicode
      # 15.0.0), which drifts the regex table — pin the interpreter to match.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Generated-artifact integrity
        run: sh scripts/check-generated.sh
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Compile mfb
        run: cargo build --bin mfb
      # v4 artifacts are zipped and DROP the executable bit; the consumers chmod
      # +x after download.
      - uses: actions/upload-artifact@v4
        with:
          name: mfb-bin
          path: target/debug/mfb

  # --- parallel test jobs (all gated on `build`) ---

  # Uninstrumented unit/integration suite across every supported host family.
  # The native GitHub runners cover x86-64/glibc, AArch64/glibc, Win64, and
  # macOS/AArch64. The x86-64/musl row uses Rust's musl target on the native
  # Linux runner, while the riscv64/glibc row cross-links against Debian's
  # riscv64 sysroot and executes each test binary through qemu-user. Each matrix
  # row recompiles under the test profile (separate from build's binary).
  test:
    needs: build
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # A failure on one platform must not hide results from the other five.
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: linux-x86_64-glibc
            runner: ubuntu-24.04
            rust_target: native
          - name: linux-x86_64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - name: linux-aarch64-glibc
            runner: ubuntu-24.04-arm
            rust_target: native
          - name: linux-riscv64-glibc
            runner: ubuntu-24.04
            rust_target: riscv64gc-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-2025
            rust_target: native
          - name: macos-aarch64
            runner: macos-15
            rust_target: native
    steps:
      - uses: actions/checkout@v4
      - name: Install native Rust toolchain
        if: matrix.rust_target == 'native'
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Install cross Rust toolchain
        if: matrix.rust_target != 'native'
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install musl linker
        if: matrix.rust_target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Install RISC-V linker and emulator
        if: matrix.rust_target == 'riscv64gc-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-riscv64-linux-gnu qemu-user
      - name: Cargo test (native)
        if: matrix.rust_target == 'native'
        run: cargo test --workspace
      - name: Cargo test (x86-64 musl)
        if: matrix.rust_target == 'x86_64-unknown-linux-musl'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo test --workspace --target x86_64-unknown-linux-musl
      - name: Cargo test (RISC-V glibc under QEMU)
        if: matrix.rust_target == 'riscv64gc-unknown-linux-gnu'
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64 -L /usr/riscv64-linux-gnu
        run: cargo test --workspace --target riscv64gc-unknown-linux-gnu

  # Acceptance: reuses the compiled binary (no recompile). test-accept.sh uses
  # bash arrays + process substitution, so it must run under bash (not sh).
  acceptance:
    needs: build
    runs-on: ubuntu-latest
    # Backstop against a wedged fixture: test-accept.sh already caps each fixture's
    # build and execution (run_with_watchdog, MFB_ACCEPT_RUN_TIMEOUT below), so a
    # healthy run finishes under this. Without it, a hang would burn GitHub's
    # 6-hour job default.
    #
    # 40 minutes was only ever enough because the runnable fixtures were failing
    # instantly: this job ran the musl binary on a glibc runner, so every one died
    # in the dynamic loader at exit 127 without executing. Now that they actually
    # run under the debug (≈5x slower than release) compiler, a full sweep needs
    # substantially longer — the 40-minute cap cancelled the job at fixture 651 of
    # 1271. Measured from that run: ~51% in 40 min, and the back half (compile-only
    # `syntax/*`) is faster than the front.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mfb-bin
          path: target/debug
      - run: chmod +x target/debug/mfb
      - name: Acceptance tests
        # This job drives the DEBUG compiler (the `build` job's artifact), which is
        # ~5x slower than release: `tests/acceptance` measures 63.7s under release
        # and 338.6s under debug on an M-series Mac, so the harness's 300s default
        # per-fixture watchdog fails a healthy fixture here (exit 99, "timeout").
        # Raise the bound for this job only; it still turns a genuine hang into one
        # named failure well inside the 40-minute job cap above.
        env:
          MFB_ACCEPT_RUN_TIMEOUT: "1200"
        run: bash scripts/test-accept.sh target/debug/mfb target/accept-actual

  # Golden/artifact byte-identity gate: execution-free codegen-dump diff. Reuses
  # the compiled binary; `all` sweeps every fixture under tests/. Also bash-only.
  artifact:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mfb-bin
          path: target/debug
      - run: chmod +x target/debug/mfb
      - name: Golden/artifact tests
        run: bash scripts/artifact-gate.sh target/debug/mfb all

  # Coverage recompiles instrumented (a third profile), so it builds its own
  # targets rather than reusing the binary.
  coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Run coverage
        run: sh scripts/coverage.sh
      - name: Per-file 98% gate
        run: sh scripts/coverage-check.sh
      - name: Global floor gate
        run: |
          . ./scripts/coverage-common.sh
          cargo llvm-cov report $PKG_FLAGS \
            --ignore-filename-regex "$IGNORE" \
            --fail-under-lines 98
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage

  # Runs only after every test job above has passed. build-examples.sh builds
  # each example for all registered targets and bundles them into
  # target/examples.zip. It builds its own release compiler (the test jobs'
  # binary is debug), so this job needs the Rust toolchain. bash-only.
  examples:
    needs: [test, acceptance, artifact, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build examples for all targets
        run: bash scripts/build-examples.sh
      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: target/examples.zip
          retention-days: 14
