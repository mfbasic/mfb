[package]
name = "argon2ref"
version = "0.1.0"
edition = "2021"

# Its OWN workspace, deliberately. This crate sits inside the mfb workspace's
# directory tree but is not a member of it: it is offline oracle tooling, never
# linked into the compiler or the runtime, and it pins a dependency version
# (`argon2 =0.5.3`) that must not be resolved against the compiler's lockfile.
#
# Without this table `cargo` refuses to build here at all -- "current package
# believes it's in a workspace when it's not". The alternative Cargo suggests is
# adding this path to the root manifest's `workspace.exclude`, which would edit a
# file every other session is building against for the sake of a tool none of
# them use.
[workspace]

[dependencies]
# PINNED, and the pin is the point: an oracle whose version floats is not an
# oracle. `=0.5.3` is the version whose agreement with this reference was
# measured (bug-515).
argon2 = "=0.5.3"

[profile.release]
opt-level = 3
