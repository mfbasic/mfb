[package]
name = "keysref"
version = "0.1.0"
edition = "2021"

# Its OWN workspace, deliberately -- same reasoning as the sibling oracles.
[workspace]

# PINNED exactly. An oracle whose version floats is not an oracle: the thing that
# agreed is gone. None of these is hand-written here -- independent AUTHORSHIP is
# the entire source of this tool's authority.
#
# These are the curves the compiler's own dev-dependencies cannot reach.
# `tests/interop/rt_crypto_key_interop.rs` covers Ed25519, X25519 and P-256/P-384 on
# every `cargo test`, because ring/dalek were already in the lockfile. Ed448,
# X448 and P-521 have no implementation there, and pulling six more crates into
# the compiler's dev-dependencies would mean new compiled code in every CI job on
# five platforms. So they are checked here, and this tool covers the FULL matrix
# so the two overlap rather than abut.
[dependencies]
# Ed448 (RFC 8032 PureEd448). NOT ed448-goldilocks: its released versions expose
# only curve arithmetic, and its signing API exists only in a 0.14 prerelease.
ed448-rust = "=0.1.1"
x448 = "=0.6.0"
ed25519-dalek = "=2.2.0"
curve25519-dalek = "=4.1.3"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
p384 = { version = "=0.13.1", features = ["ecdsa"] }
p521 = { version = "=0.13.3", features = ["ecdsa"] }
sha2 = "=0.10.8"
sha3 = "=0.10.8"

[profile.release]
opt-level = 3
